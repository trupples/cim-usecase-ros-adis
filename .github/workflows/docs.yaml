name: Generate documentation
on:
    push:
      branches:
        - main
      tags:
        - "*.*.*"
    pull_request:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-doc:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.head_ref }}
        persist-credentials: false
        token: ${{ env.GH_TOKEN }}
        lfs: true

    - name: Set up Python3 environment
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.13"

    - name: Install pip packages
      working-directory: docs
      run: |
        pip install pip --upgrade
        pip install -r requirements.txt

    - name: Build docs
      working-directory: docs
      run: adoc serve --once --verbose
      
    - name: Store the generated docs
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: html
        path: docs/_build/dirhtml

  deploy:
    runs-on: ubuntu-latest
    needs: [build-doc]
    concurrency:
      group: gh-pages
    permissions:
      contents: write
      pull-requests: read
    if: >
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request' ||
      github.ref_type == 'tag'

    steps:
    - uses: analogdevicesinc/doctools/gh-pages-deploy@7ab0f7720d5ffdf16e3d89005858e26a652d032d #@action
      with:
        new_tag: ${{ github.ref_type == 'tag' }}
        tag: ${{ github.ref_name }}
        name: html
        gh-token: ${{ secrets.GITHUB_TOKEN }}
